<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Informatika testi: SQL/Access va Tarmoq texnologiyalari</title>
<style>
:root{
  --bg:#f4f6fb;--card:#ffffff;--ink:#1c2333;--sub:#5b6478;--accent:#3454d1;--accent2:#7c8cf8;
  --ok:#1f9d55;--okbg:#e7f8ee;--bad:#d64545;--badbg:#fdecec;--line:#e4e8f3;--code:#0f1524;--codetx:#c9d6ff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#12151f;--card:#1a1f2e;--ink:#eaeefb;--sub:#9aa3bd;--line:#2a3145;--okbg:#123322;--badbg:#3a1a1a;}
}
:root[data-theme="dark"]{--bg:#12151f;--card:#1a1f2e;--ink:#eaeefb;--sub:#9aa3bd;--line:#2a3145;--okbg:#123322;--badbg:#3a1a1a;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;min-height:100%;}
header{position:sticky;top:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;z-index:5;}
header h1{margin:0 0 4px;font-size:16px;font-weight:700}
header p{margin:0;font-size:12px;opacity:.9}
.wrap{max-width:760px;margin:0 auto;padding:16px;}
.bar{height:8px;background:rgba(255,255,255,.35);border-radius:6px;margin-top:10px;overflow:hidden}
.bar>div{height:100%;background:#fff;border-radius:6px;transition:width .25s}
.section-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--accent);background:#eef1ff;padding:3px 9px;border-radius:20px;margin-bottom:8px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .section-tag{background:#232a44}}
:root[data-theme="dark"] .section-tag{background:#232a44}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 1px 3px rgba(20,30,60,.06)}
.qnum{color:var(--sub);font-size:12px;margin-bottom:2px}
.qtext{font-size:16px;line-height:1.5;margin:0 0 10px;font-weight:600}
.ctx{font-size:13px;color:var(--sub);margin-bottom:10px;line-height:1.5}
table{border-collapse:collapse;width:100%;font-size:12px;margin:8px 0 12px;overflow-x:auto;display:block;white-space:nowrap}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left}
th{background:var(--bg);font-weight:700}
pre{background:var(--code);color:var(--codetx);padding:10px 12px;border-radius:10px;font-size:12.5px;overflow-x:auto;margin:8px 0 12px;white-space:pre-wrap}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin:7px 0;font-size:14px;color:var(--ink);cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--accent)}
.opt.correct{border-color:var(--ok);background:var(--okbg);font-weight:700}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.ans-box{margin-top:12px;padding:12px 14px;background:var(--okbg);border:1px solid var(--ok);border-radius:11px;font-size:14px;display:none}
.ans-box.show{display:block}
.ans-box b{color:var(--ok)}
.navrow{display:flex;gap:10px;margin-top:16px}
.nbtn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;font-weight:600;cursor:pointer}
.nbtn.primary{background:var(--accent);color:#fff;border:none}
.nbtn:disabled{opacity:.4;cursor:default}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.jbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--sub);font-size:11px;cursor:pointer}
.jbtn.done{background:var(--accent);color:#fff;border-color:var(--accent)}
.jbtn.active{outline:2px solid var(--accent2)}
.jbtn.right{background:var(--ok);border-color:var(--ok)}
.jbtn.wrongj{background:var(--bad);border-color:var(--bad)}
.score{font-size:15px;font-weight:700;text-align:center;margin-top:14px}
footer{text-align:center;color:var(--sub);font-size:11px;padding:20px 10px 30px}
</style>
</head>
<body>
<header>
  <div class="wrap" style="padding:0">
    <h1>Informatika testi</h1>
    <p id="hp">SQL / MS Access va Tarmoq texnologiyalari — 37 savol</p>
    <div class="bar"><div id="pbar" style="width:0%"></div></div>
  </div>
</header>
<div class="wrap">
  <div class="card" id="card"></div>
  <div class="navrow">
    <button class="nbtn" id="prevB">&larr; Oldingi</button>
    <button class="nbtn primary" id="nextB">Keyingi &rarr;</button>
  </div>
  <div class="jump" id="jump"></div>
  <div class="score" id="scoreBox"></div>
</div>
<footer>Manba: Toshmamatov Anvarbek — SQL/Access va Tarmoq texnologiyalari savollari. Har bir variant va javob mos hisob-kitoblar bilan tekshirilgan.</footer>
<script>

[3,'Abulfayzxon','A.Fitrat',165,38000,'uz'],[4,'Mehrobdan chayon','A.Qodiriy',246,49000,'uz'],

var foods=T(['food_id','food_name','price_per_kg','full_weight','region','type'],[

var foodsRes=T(['food_id','food_name','full_weight'],[[5,'Lemon',37],[1,'Apple',72],[3,'Grape',51],[2,'Strawberry',36]]);

var Q=[
{s:1,q:"\u201Cteachers\u201D jadvali berilgan. Ushbu SQL so'rovi bajarilgach nechta natija chiqadi?",
ctx:teachersV1+C("SELECT * FROM teachers WHERE category='first category' AND salary > 4300000;"),
opts:["A) 0","B) 1","C) 2","D) 3"],correct:1,
expl:"first category'dan faqat Usmonova Xadicha (5200000) shartga mos keladi; Akbarov Botir (4200000) 4300000 dan katta emas — jami 1 ta natija."},

{s:1,q:"Olimpiada jadvallariga ko'ra: matematika va kimyo fanlaridan oltin medal olgan o'quvchilar o'qiydigan maktablarning reyting ballari yig'indisini toping (oltin=15, kumush=9, bronza=4).",
ctx:olympA1+olympA2,opts:["A) 38 ball","B) 19 ball","C) 57 ball","D) 33 ball"],correct:2,
expl:"Matematikadan oltin — Asqarova K. (23-maktab, jami 38 ball), kimyodan oltin — Rustamov S. (48-maktab, jami 19 ball). 38+19=57."},

{s:1,q:"Avtobus jadvaliga ko'ra, soat 9:00 da Bektemirda bo'lgan sayohatchi Chimboyga eng tez qachon yetib boradi?",
ctx:bus,opts:["A) 11:10","B) 12:50","C) 14:20","D) 13:40"],correct:2,
expl:"To'g'ridan-to'g'ri Bektemir\u2192Chimboy reysi 13:00 da jo'nab, 14:20 da yetib keladi — bu eng tez variant."},

{s:1,q:"\u201Cteachers\u201D jadvali (id versiyasi). SELECT * FROM teachers WHERE NOT category=\"assistant\" LIMIT 5; natijasidagi \u201Cexperience\u201D ustunining eng kichik va eng katta qiymatlari o'rta arifmetigini toping.",
ctx:teachersV2,opts:["A) 15","B) 17","C) 19","D) 21"],correct:1,
expl:"Assistant chiqarib tashlansa, birinchi 5 mos qator: 12,19,22,14,12. min=12,max=22, o'rtachasi=(12+22)/2=17."},

{s:1,q:"Xuddi shu olimpiada jadvallariga ko'ra: reyting ballari farqi eng kichik bo'lgan ikkita maktab o'quvchilarining jami oltin va bronza medallari sonini toping.",
ctx:olympA1+olympA2,opts:["A) 1 ta oltin, 3 ta bronza","B) 2 ta oltin, 2 ta bronza","C) 0 ta oltin, 4 ta bronza","D) 1 ta oltin, 2 ta bronza"],correct:0,
expl:"Maktablar balli: 8=17, 23=38, 48=19, 91=33. Eng kichik juft farq — 8 va 48 (|17-19|=2). Ular birgalikda: 1 oltin, 1 kumush, 3 bronza."},

{s:1,q:"\u201Cmarket\u201D jadvali. SELECT product_name, price, region FROM market WHERE region LIKE %u% AND total_cost < 1000000 ORDER BY unit; natijasini toping.",
ctx:market+C("SELECT product_name, price, region FROM market WHERE region LIKE %u% AND total_cost < 1000000 ORDER BY unit;"),
opts:["A) Carrot/8000/Russia; Apple/18000/Uzbekistan; Tomato/10000/Uzbekistan","B) Apple/18000/Uzbekistan; Carrot/8000/Russia; Tomato/10000/Uzbekistan","C) Tomato/10000/Uzbekistan; Apple/18000/Uzbekistan; Carrot/8000/Russia","D) Carrot/8000/Russia; Tomato/10000/Uzbekistan; Apple/18000/Uzbekistan"],correct:0,
expl:"'u' harfli regionlar va total_cost<1000000: Apple,Tomato,Carrot qoladi. unit bo'yicha o'sish tartibida: Carrot(37),Apple(46),Tomato(61)."},

{s:1,q:"Qidiruv jadvali: Computer&Printer=360000, Computer&Scaner=410000, (Computer|Scaner)&Printer=550000. Scaner&(Computer|Printer)=x ni toping.",
ctx:"",opts:["A) 550 000","B) 600 000","C) 650 000","D) 500 000"],correct:1,
expl:"(C|S)&P=C&P+S&P-C&S&P \u2192 S&P-C&S&P=550000-360000=190000. S&(C|P)=C&S+(S&P-C&S&P)=410000+190000=600000."},

{s:1,q:"\u201Cteachers\u201D (id versiyasi). SELECT * FROM teachers WHERE full_name LIKE '%a%a%' AND NOT category='assistant' LIMIT 3; natijasidagi experience yig'indisini toping.",
ctx:teachersV2,opts:["A) 34","B) 48","C) 53","D) 41"],correct:1,
expl:"Kamida 2 ta 'a' harfli va assistant bo'lmagan birinchi 3 qator: Akbarov(12), Usmonova(22), Qurbonova(14). 12+22+14=48."},

{s:1,q:"MS Access \u201Cbooks\u201D jadvali. So'rov: price<=84000 va language Not In('ru','en'). Natijaning price ustuni o'rta arifmetigini toping.",
ctx:books,opts:["A) 49 000","B) 56 000","C) 63 000","D) 71 000"],correct:1,
expl:"Faqat 'uz' tilidagi va price<=84000: Abulfayzxon(38000), Mehrobdan chayon(49000), Ufq(81000). (38000+49000+81000)/3=56000."},

{s:1,q:"\u201Cfoods\u201D jadvali. Natija quyidagi ko'rinishga chiqqan bo'lsa, qaysi SQL so'rov ishlatilgan?",
ctx:foods+"<div style='margin:8px 0;font-size:12px;color:var(--sub)'>Natija:</div>"+foodsRes,
opts:[
"A) SELECT * FROM foods WHERE full_weight IN(36,37,54) OR NOT price_per_kg=29000 ORDER BY type DESC;",
'B) SELECT food_id, food_name, full_weight FROM foods WHERE NOT price_per_kg=29000 AND region LIKE "*i*" ORDER BY food_name ASC;',
'C) SELECT food_id, food_name, full_weight FROM foods WHERE NOT full_weight IN(36,37,54) OR region LIKE "*in*" ORDER BY type DESC;',
'D) SELECT food_id, food_name, full_weight FROM foods WHERE type="Lady finger" AND NOT price_per_kg IN (35000,54000,34000) ORDER BY type DESC;'],
correct:2,expl:"NOT full_weight IN(36,37,54) \u2192 Apple,Grape; region LIKE *in* \u2192 Grape,Strawberry,Lemon. OR birlashtirilsa: Apple,Grape,Strawberry,Lemon — aynan natijadagi 4 qator, type DESC tartibi ham mos."},

{s:1,q:"\u201Cteachers\u201D (id). SELECT full_name, category, salary FROM teachers WHERE NOT category='second category' AND experience>=13 ORDER BY salary DESC; natijasini toping.",
ctx:teachersV2,
opts:["A) Ashurov(6800000),Akramova(6900000),Usmonova(7200000)","B) Usmonova(7200000),Akramova(6900000),Rahimov Farhod(5200000)","C) Usmonova(7200000),Akramova(6900000),Ashurov(6800000)","D) Ashurov(6800000),Usmonova(7200000),Akramova(6900000)"],
correct:2,expl:"Mos qatorlar: Ashurov(6800000),Usmonova(7200000),Akramova(6900000). salary DESC: Usmonova,Akramova,Ashurov."},

{s:1,q:"Qidiruv jadvali: Computer&Printer=360000, Computer&Scaner=410000, Scaner&(Computer|Printer)=600000. (Computer|Scaner)&Printer=x?",
ctx:"",opts:["A) 570 000","B) 550 000","C) 610 000","D) 540 000"],correct:1,
expl:"(C|S)&P=C&P+(S&(C|P)-C&S)=360000+(600000-410000)=550000."},

{s:1,q:"Olimpiada (2-jadval, boshqa ma'lumotlar, oltin=13,kumush=7,bronza=3). Reyting ballari farqi eng katta bo'lgan maktablar o'quvchilarining jami oltin va kumush medallari sonini toping.",

correct:2,expl:"Maktablar balli: 10=23,34=16,73=13,119=26. Eng katta juft farq — 73 va 119 (26-13=13). Birgalikda: 2 oltin,1 kumush."},

{s:1,q:"\u201Cmarket\u201D jadvali. SELECT * FROM market WHERE product_name LIKE %p% OR price<=15000 LIMIT 5 ORDER BY id; natijasining unit ustuni yig'indisini toping.",

{s:1,q:"So'rov: (Computer|Printer)&Scaner=x, Computer|Printer|Scaner=y, Computer|Printer=z, Computer&Printer&Scaner=w. To'g'ri o'sish tartibini toping.",
ctx:"",opts:["A) w < z < x < y","B) y < x < z < w","C) y < z < x < w","D) w < x < z < y"],correct:3,
expl:"To'plamlar nazariyasiga ko'ra doim w\u2264x\u2264z\u2264y (w — uchtaning kesishmasi, y — uchtaning birlashmasi)."},

{s:1,q:"\u201Cmarket\u201D. SELECT * FROM market WHERE NOT unit IN(23,34,37) AND NOT region='Russia' ORDER BY product_name; natijasining 1- va oxirgi qatoridagi unit yig'indisini toping.",
ctx:market+C("SELECT * FROM market WHERE NOT unit IN(23,34,37) AND NOT region='Russia' ORDER BY product_name;"),

expl:"Mos qatorlar: Apple,Tomato,Pineapple,Lemon. Alifbo bo'yicha: Apple(46)...Tomato(61). 46+61=107."},

{s:1,q:"\u201Cmarket\u201D. SELECT product_name, price, region FROM market WHERE NOT region='Uzbekistan' AND unit>35 ORDER BY price DESC; natijasini toping.",
ctx:market+C("SELECT product_name, price, region FROM market WHERE NOT region='Uzbekistan' AND unit > 35 ORDER BY price DESC;"),
opts:["A) Pineapple/42000/Columbia; Lemon/29000/Turkiye; Carrot/8000/Russia","B) Lemon/29000/Turkiye; Pineapple/42000/Columbia; Carrot/8000/Russia","C) Carrot/8000/Russia; Lemon/29000/Turkiye; Pineapple/42000/Columbia","D) Pineapple/42000/Columbia; Carrot/8000/Russia; Lemon/29000/Turkiye"],correct:0,
expl:"Uzbekistan chiqarilib, unit>35: Pineapple(54),Lemon(49),Carrot(37) qoladi. price DESC bo'yicha shu tartib."},

{s:2,q:"Ta'rifga ko'ra qaysi topologiya: \u201Ckompyuterlar bitta kabel(segment) bo'ylab ulangan; barcha tugun ma'lumotni qabul qilishi mumkin; umumiy kabel orqali axborot almashinadi\u201D?",
ctx:"",opts:["A) halqa(ring)","B) to'rli(mesh)","C) shina(bus)","D) yulduz(star)"],correct:2,
expl:"Barcha tugunlarning bitta umumiy kabelga ulanishi — shina (bus) topologiyasi."},

{s:2,q:"Ali IP manzilini yozdi, Vali uni 4 bo'lakka bo'ldi: a=\"36.4\", b=\"101.\", c=\"3.2\", d=\"11\". To'g'ri tartibni toping (IP manzil hosil bo'lishi uchun).",
ctx:"",opts:["A) b, a, c, d","B) a, c, b, d","C) d, b, a, c","D) c, a, d, b"],correct:0,

var cur=0,answered=new Array(Q.length).fill(false),picked=new Array(Q.length).fill(-1),correctCount=0;
var secName={1:"SQL / MS Access",2:"Tarmoq texnologiyalari"};

function renderJump(){
  var j=document.getElementById('jump');j.innerHTML='';
  Q.forEach(function(q,i){
    var b=document.createElement('button');
    var cls='jbtn'+(i===cur?' active':'');
    if(answered[i])cls+=(picked[i]===q.correct?' right':' wrongj');
    b.className=cls;b.textContent=i+1;b.onclick=function(){cur=i;render();};j.appendChild(b);
  });
}
function setProgress(){
  var done=answered.filter(Boolean).length;
  document.getElementById('pbar').style.width=Math.round((cur+1)/Q.length*100)+'%';
  document.getElementById('hp').textContent=secName[Q[cur].s]+" — savol "+(cur+1)+"/"+Q.length+" (javob berilgan: "+done+")";
}
function render(){
  var q=Q[cur],c=document.getElementById('card'),html='';
  html+='<div class="section-tag">'+secName[q.s]+'</div>';
  html+='<div class="qnum">'+(cur+1)+'-savol</div>';
  html+='<p class="qtext">'+q.q+'</p>';
  if(q.ctx)html+='<div class="ctx">'+q.ctx+'</div>';
  html+='<div id="opts">';
  q.opts.forEach(function(o,i){html+='<button class="opt" data-i="'+i+'" onclick="pick('+i+')">'+o+'</button>';});
  html+='</div><div class="ans-box" id="ab"><b id="reslabel">Izoh:</b> <span id="exspan"></span></div>';
  c.innerHTML=html;
  if(answered[cur])restoreMcq();
  document.getElementById('prevB').disabled=cur===0;
  document.getElementById('nextB').textContent=cur===Q.length-1?'Yakunlash':'Keyingi \u2192';
  setProgress();renderJump();updateScore();
}
function pick(i){
  var q=Q[cur];if(answered[cur])return;
  var btns=document.querySelectorAll('#opts .opt');
  btns.forEach(function(b,idx){
    if(idx===q.correct)b.classList.add('correct');
    else if(idx===i)b.classList.add('wrong');
    b.onclick=null;
  });
  picked[cur]=i;
  if(i===q.correct)correctCount++;
  answered[cur]=true;
  document.getElementById('reslabel').textContent=(i===q.correct?"To'g'ri! Izoh:":"Noto'g'ri. Izoh:");
  document.getElementById('exspan').textContent=q.expl;
  document.getElementById('ab').classList.add('show');
  renderJump();updateScore();
}
function restoreMcq(){
  var q=Q[cur],btns=document.querySelectorAll('#opts .opt');
  btns.forEach(function(b,idx){
    if(idx===q.correct)b.classList.add('correct');
    else if(idx===picked[cur])b.classList.add('wrong');
    b.onclick=null;
  });
  document.getElementById('reslabel').textContent=(picked[cur]===q.correct?"To'g'ri! Izoh:":"Noto'g'ri. Izoh:");
  document.getElementById('exspan').textContent=q.expl;
  document.getElementById('ab').classList.add('show');
}
function updateScore(){
  document.getElementById('scoreBox').textContent="Ball: "+correctCount+" / "+Q.length;
}
document.getElementById('prevB').onclick=function(){if(cur>0){cur--;render();}};
document.getElementById('nextB').onclick=function(){if(cur<Q.length-1){cur++;render();}else{window.scrollTo({top:0,behavior:'smooth'});}};
render();
</script>

</html>
